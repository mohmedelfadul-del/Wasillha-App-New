<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Wasilha — وصلها · Premium Mobility for Sudan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    /* Connected-pair puzzle entry */
    @keyframes ws-puzzle-in {
      from { opacity: 0; transform: translateY(14px) scale(0.985); }
      to   { opacity: 1; transform: translateY(0)    scale(1); }
    }
    .ws-puzzle > * {
      opacity: 1;
      animation: ws-puzzle-in 0.45s cubic-bezier(0.2,0.85,0.2,1) both;
    }
    .ws-puzzle > *:nth-child(1) { animation-delay: 0.04s; }
    .ws-puzzle > *:nth-child(2) { animation-delay: 0.10s; }
    .ws-puzzle > *:nth-child(3) { animation-delay: 0.16s; }
    .ws-puzzle > *:nth-child(4) { animation-delay: 0.22s; }
    @media (prefers-reduced-motion: reduce) {
      .ws-puzzle > * { animation: none; }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body style="background-color: rgb(10, 9, 8)">
  <div id="app"></div>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="split-cards.jsx"></script>
  <script type="text/babel" src="connected-pairs.jsx"></script>
  <script type="text/babel" src="home-pairs.jsx"></script>
  <script type="text/babel" src="screens-pre.jsx"></script>
  <script type="text/babel" src="screens-main.jsx"></script>
  <script type="text/babel" src="screens-aux.jsx"></script>
  <script type="text/babel" src="screens-extra.jsx"></script>
  <script type="text/babel" src="screens-roles.jsx"></script>
  <script type="text/babel" src="screens-offer.jsx"></script>
  <script type="text/babel" src="screens-services.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "#9D00FF",
      "glass": 15,
      "cardLayout": "pairs",
      "mapStyle": "illustrated",
      "language": "en"
    }/*EDITMODE-END*/;

    // Screen catalog (label · short caption · order)
    const SCREENS = [
      { id: 'splash',        label: '01 Splash',        cap: 'Identity beat' },
      { id: 'onboarding',    label: '02 Onboarding',    cap: 'Three promises' },
      { id: 'login',         label: '03 Login',         cap: 'Phone-first auth' },
      { id: 'otp',           label: '04 OTP',           cap: 'Verify · 6 digits' },
      { id: 'role',          label: '05 Role',          cap: 'Passenger · Driver · Store' },
      { id: 'home',          label: '06 Home',          cap: 'Map + services' },
      { id: 'search',        label: '07 Search',        cap: 'Pick destination' },
      { id: 'booking',       label: '08 Booking',       cap: 'Choose your ride' },
      { id: 'offer',         label: '09 Offer',         cap: 'Set fare · driver bids' },
      { id: 'food',          label: '09b Food',         cap: 'Restaurant · menu' },
      { id: 'parcel',        label: '09c Parcel',       cap: 'Send a package' },
      { id: 'tracking',      label: '10 Tracking',      cap: 'Live · driver inbound' },
      { id: 'complete',      label: '11 Trip done',     cap: 'Rate · pay · receipt' },
      { id: 'wallet',        label: '12 Wallet',        cap: 'Balance · activity' },
      { id: 'topup',         label: '13 Top-up',        cap: 'Add funds' },
      { id: 'history',       label: '14 History',       cap: 'Where you\'ve been' },
      { id: 'notifications', label: '15 Notifications', cap: 'What\'s new' },
      { id: 'saved',         label: '16 Saved places',  cap: 'Your shortcuts' },
      { id: 'settings',      label: '17 Account',       cap: 'Profile · prefs' },
      { id: 'sos',           label: '18 Safety / SOS',  cap: 'Hold for safety team' },
      { id: 'driverHome',     label: '19 Driver',        cap: 'Online · accept rides' },
      { id: 'driverRequests', label: '19b Requests',     cap: 'Incoming offers · bids' },
      { id: 'driverEarnings', label: '20 Earnings',      cap: 'Weekly · breakdown' },
      { id: 'driverDelivery', label: '21 Driver trip',   cap: 'Pickup → drop-off' },
      { id: 'store',          label: '22 Store',         cap: 'Orders · menu · branches' },
    ];

    function App() {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [screen, setScreen] = useState('splash');
      const [tweaksOpen, setTweaksOpen] = useState(false);

      // Listen for host edit-mode messages (registered BEFORE announcing available)
      useEffect(() => {
        const handler = (e) => {
          if (!e.data) return;
          if (e.data.type === '__activate_edit_mode') setTweaksOpen(true);
          if (e.data.type === '__deactivate_edit_mode') setTweaksOpen(false);
        };
        window.addEventListener('message', handler);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', handler);
      }, []);

      const nav = (id) => {
        setScreen(id);
        // scroll the inner device viewport to top whenever screen changes
        requestAnimationFrame(() => {
          document.querySelectorAll('.no-scroll').forEach(el => { el.scrollTop = 0; });
        });
      };

      const screenProps = {
        nav,
        accent: tweaks.accent,
        lang: tweaks.language,
        glass: tweaks.glass,
        cardLayout: tweaks.cardLayout,
        mapStyle: tweaks.mapStyle,
      };

      const current = SCREENS.find(s => s.id === screen);

      const ScreenEl = {
        splash:        SplashScreen,
        onboarding:    OnboardingScreen,
        login:         LoginScreen,
        otp:           OTPScreen,
        role:          RoleScreen,
        home:          HomeScreen,
        search:        SearchScreen,
        booking:       BookingScreen,
        offer:         OfferScreen,
        food:          FoodScreen,
        parcel:        ParcelScreen,
        tracking:      TrackingScreen,
        complete:      CompleteScreen,
        wallet:        WalletScreen,
        topup:         TopupScreen,
        history:       HistoryScreen,
        notifications: NotificationsScreen,
        saved:         SavedScreen,
        settings:      SettingsScreen,
        sos:           SOSScreen,
        driverHome:     DriverHomeScreen,
        driverRequests: DriverRequestsScreen,
        driverEarnings: DriverEarningsScreen,
        driverDelivery: DriverDeliveryScreen,
        store:          StoreScreen,
      }[screen];

      // hide tweaks panel close also flips host toggle
      const closeTweaks = () => {
        setTweaksOpen(false);
        window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
      };

      const dir = tweaks.language === 'ar' ? 'rtl' : 'ltr';

      return (
        <div className="stage">
          {/* Stage rail (decorative) */}
          <div className="stage-rail">
            <div className="num">CASE FILE / 2026</div>
            <div className="ar-label">وصلها</div>
            <div className="en-label">Wasilha.</div>
            <div className="num" style={{ marginTop: 4 }}>HI-FI PROTOTYPE · iOS</div>
          </div>

          <div className="device-stage">
            <div className="device-caption">
              <span className="dot" />
              <span>{current.label}</span>
              <span style={{ opacity: 0.5 }}>·</span>
              <span style={{ color: '#0A0908' }}>{current.cap}</span>
            </div>

            <IOSDevice width={402} height={874} dark={false}>
              <div dir={dir} style={{ position: 'absolute', inset: 0, overflow: 'hidden', background: '#FBFAF6' }}>
                <ScreenEl key={screen} {...screenProps} />
              </div>
            </IOSDevice>

            {/* Screen picker rail (right side) */}
            <ScreenPicker screens={SCREENS} current={screen} onPick={nav} accent={tweaks.accent} />
          </div>

          <div className="stage-meta">
            <div>© 2026 WASILHA INDUSTRIES · KRT</div>
            <div style={{ display: 'flex', gap: 14 }}>
              <span>SAFE-AREA · NOTCH · DYNAMIC ISLAND</span>
              <span style={{ color: tweaks.accent }}>● PROTOTYPE LIVE</span>
            </div>
          </div>

          {/* Tweaks panel */}
          {tweaksOpen && (
            <TweaksPanel title="Tweaks" onClose={closeTweaks}>
              <TweakSection title="Screen">
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6 }}>
                  {SCREENS.map(s => (
                    <button key={s.id} onClick={() => nav(s.id)} style={{
                      appearance: 'none', border: 0, cursor: 'pointer',
                      background: screen === s.id ? '#0A0908' : '#fff',
                      color: screen === s.id ? '#fff' : '#0A0908',
                      borderRadius: 8, padding: '8px 10px',
                      fontFamily: 'inherit', fontSize: 11, textAlign: 'left',
                      border: '0.5px solid rgba(0,0,0,0.08)',
                    }}>{s.label}</button>
                  ))}
                </div>
              </TweakSection>

              <TweakSection title="Brand">
                <TweakColor
                  label="Accent"
                  value={tweaks.accent}
                  onChange={(v) => setTweak('accent', v)}
                  options={['#9D00FF','#E4572E','#1F8A5B','#2A6FDB','#E4B73B']}
                />
              </TweakSection>

              <TweakSection title="Surface">
                <TweakSlider label="Glass intensity" min={0} max={100} step={5} value={tweaks.glass} onChange={(v) => setTweak('glass', v)} />
              </TweakSection>

              <TweakSection title="Home layout">
                <TweakRadio
                  label="Service cards"
                  value={tweaks.cardLayout}
                  onChange={(v) => setTweak('cardLayout', v)}
                  options={[
                    { label: 'Pairs', value: 'pairs' },
                    { label: 'Grid', value: 'grid' },
                    { label: 'Row', value: 'row' },
                  ]}
                />
              </TweakSection>

              <TweakSection title="Map">
                <TweakRadio
                  label="Style"
                  value={tweaks.mapStyle}
                  onChange={(v) => setTweak('mapStyle', v)}
                  options={[
                    { label: 'White', value: 'white' },
                    { label: 'Dark', value: 'dark' },
                    { label: 'Illus.', value: 'illustrated' },
                  ]}
                />
              </TweakSection>

              <TweakSection title="Language">
                <TweakRadio
                  label="Direction"
                  value={tweaks.language}
                  onChange={(v) => setTweak('language', v)}
                  options={[
                    { label: 'EN', value: 'en' },
                    { label: 'العربية', value: 'ar' },
                  ]}
                />
              </TweakSection>
            </TweaksPanel>
          )}
        </div>
      );
    }

    function ScreenPicker({ screens, current, onPick, accent }) {
      return (
        <div style={{
          display: 'flex', flexDirection: 'column', gap: 2,
          padding: '12px 10px',
          background: '#fff',
          border: '0.5px solid rgba(0,0,0,0.06)',
          borderRadius: 18,
          boxShadow: '0 10px 30px rgba(20,15,30,0.08)',
          minWidth: 200,
          alignSelf: 'stretch',
          height: 874,
          overflowY: 'auto',
        }}>
          <div className="mono" style={{ fontSize: 9, color: 'var(--text-3)', letterSpacing: '0.3em', padding: '6px 8px 10px' }}>
            FLOW · 25 SCREENS
          </div>
          {screens.map((s, i) => {
            const active = s.id === current;
            return (
              <button key={s.id} onClick={() => onPick(s.id)} style={{
                appearance: 'none', border: 0, cursor: 'pointer',
                background: active ? '#0A0908' : 'transparent',
                color: active ? '#fff' : '#0A0908',
                padding: '9px 10px', borderRadius: 10,
                fontFamily: 'inherit', fontSize: 12.5, textAlign: 'left',
                display: 'flex', alignItems: 'center', gap: 10,
              }}>
                <span className="mono" style={{
                  fontSize: 9, letterSpacing: '0.15em',
                  color: active ? 'rgba(255,255,255,0.5)' : 'var(--text-3)',
                  width: 18,
                }}>{String(i + 1).padStart(2, '0')}</span>
                <span style={{ flex: 1, letterSpacing: '-0.005em' }}>{s.label.replace(/^\d\d\s/, '')}</span>
                {active && <span style={{ width: 5, height: 5, borderRadius: '50%', background: accent }} />}
              </button>
            );
          })}
          <div style={{ flex: 1 }} />
          <div style={{
            margin: '10px 8px 6px', padding: '10px 0', borderTop: '0.5px solid var(--border)',
            fontSize: 10.5, color: 'var(--text-2)', lineHeight: 1.5,
          }}>
            <div className="mono" style={{ fontSize: 9, letterSpacing: '0.22em', color: 'var(--text-3)', marginBottom: 4 }}>HINTS</div>
            Use the Tweaks panel (toolbar) to flip language, swap the accent, or change map style.
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('app'));
    root.render(<App />);
  </script>
</body>
</html>
