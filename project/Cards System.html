<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Wasilha — Card System / نظام البطاقات</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    /* Sheet drag handling */
    .ws-sheet {
      transition: transform 480ms cubic-bezier(0.2, 0.85, 0.2, 1);
      will-change: transform;
      touch-action: none;
    }
    .ws-sheet.dragging { transition: none; }

    /* Stack overlap intro animation */
    @keyframes ws-stack-in {
      from { opacity: 0; transform: translateY(28px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .ws-stack > * {
      animation: ws-stack-in 0.55s cubic-bezier(0.2,0.85,0.2,1) backwards;
    }
    .ws-stack > *:nth-child(1) { animation-delay: 0.05s; }
    .ws-stack > *:nth-child(2) { animation-delay: 0.10s; }
    .ws-stack > *:nth-child(3) { animation-delay: 0.15s; }
    .ws-stack > *:nth-child(4) { animation-delay: 0.20s; }
    .ws-stack > *:nth-child(5) { animation-delay: 0.25s; }
    .ws-stack > *:nth-child(6) { animation-delay: 0.30s; }

    .ws-bg-blob {
      position: absolute; border-radius: 50%;
      filter: blur(48px); opacity: 0.55;
      pointer-events: none;
    }

    .pill-tab {
      appearance: none; border: 0; cursor: pointer;
      background: transparent; color: #6B6862;
      font: 500 12px 'Geist', system-ui, sans-serif;
      letter-spacing: -0.005em;
      padding: 7px 14px; border-radius: 999px;
      transition: all 180ms ease;
      white-space: nowrap;
    }
    .pill-tab.active {
      background: #0A0908; color: #fff;
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="app"></div>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="split-cards.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "lang": "ar",
      "stackOverlap": 28,
      "sheetExpanded": true,
      "category": "rides"
    }/*EDITMODE-END*/;

    // ─────────────────────────────────────────────────────────────
    // The "map-ish" backdrop visible above the sheet
    // ─────────────────────────────────────────────────────────────
    function Backdrop({ lang }) {
      return (
        <div style={{
          position: 'absolute', inset: 0, overflow: 'hidden',
          background: 'linear-gradient(180deg, #FFFFFF 0%, #FBF8FF 60%, #F4ECFF 100%)',
        }}>
          {/* soft purple/lavender blobs */}
          <div className="ws-bg-blob" style={{ width: 260, height: 260, top: -60, left: -70, background: WASILHA.lavender }}/>
          <div className="ws-bg-blob" style={{ width: 220, height: 220, top: 40, right: -60, background: '#F8E0FF', opacity: 0.7 }}/>
          <div className="ws-bg-blob" style={{ width: 200, height: 200, top: 160, left: 80, background: WASILHA.ivory, opacity: 0.85 }}/>

          {/* Top: location pill + bell */}
          <div style={{ position: 'absolute', top: 60, left: 16, right: 16, display: 'flex', gap: 10, zIndex: 10 }}>
            <div style={{
              flex: 1, padding: '10px 14px 10px 14px', borderRadius: 999,
              background: 'rgba(255,255,255,0.7)', backdropFilter: 'blur(20px)',
              border: '0.5px solid rgba(255,255,255,0.9)',
              boxShadow: '0 6px 18px rgba(114,52,128,0.08)',
              display: 'flex', alignItems: 'center', gap: 10,
            }}>
              <div style={{ width: 8, height: 8, borderRadius: '50%', background: '#1F8A5B', boxShadow: '0 0 0 4px rgba(31,138,91,0.18)' }} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div className="mono" style={{ fontSize: 8.5, color: '#A6A29A', letterSpacing: '0.22em' }}>
                  {lang === 'ar' ? 'موقعك الحالي' : 'CURRENT LOCATION'}
                </div>
                <div style={{ fontSize: 13.5, fontWeight: 500, marginTop: 1, color: '#0A0908' }}>
                  {lang === 'ar' ? 'الرياض، الخرطوم' : 'Riyadh District, Khartoum'}
                </div>
              </div>
            </div>
            <div style={{
              width: 44, height: 44, borderRadius: '50%',
              background: 'rgba(255,255,255,0.7)', backdropFilter: 'blur(20px)',
              border: '0.5px solid rgba(255,255,255,0.9)',
              boxShadow: '0 6px 18px rgba(114,52,128,0.08)',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              position: 'relative',
            }}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A0908" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round">
                <path d="M6 9 a6 6 0 0 1 12 0 c0 4 1.5 5 2 6 H 4 c0.5 -1 2 -2 2 -6 Z"/>
                <path d="M10 19 a2 2 0 0 0 4 0"/>
              </svg>
              <span style={{ position: 'absolute', top: 10, right: 11, width: 7, height: 7, borderRadius: '50%', background: WASILHA.purple, border: '1.5px solid #fff' }}/>
            </div>
          </div>

          {/* Origin pin */}
          <div style={{ position: 'absolute', top: 200, left: '50%', transform: 'translateX(-50%)', zIndex: 5 }}>
            <div style={{
              width: 18, height: 18, borderRadius: '50%',
              background: WASILHA.purple, border: '3px solid #fff',
              boxShadow: `0 0 0 4px ${WASILHA.purple}22, 0 8px 18px ${WASILHA.purple}50`,
            }}>
              <div style={{
                position: 'absolute', inset: -10, borderRadius: '50%',
                background: WASILHA.purple, opacity: 0.18,
                animation: 'pulse-ring 2.4s ease-out infinite',
              }} />
            </div>
          </div>

          {/* a hint of streets (decorative SVG) */}
          <svg width="100%" height="100%" viewBox="0 0 402 600" preserveAspectRatio="none" style={{ position: 'absolute', inset: 0, opacity: 0.42 }}>
            <path d="M -20 220 Q 100 180 200 220 T 420 200" stroke="#D6CDE8" strokeWidth="14" fill="none" strokeLinecap="round"/>
            <path d="M -20 220 Q 100 180 200 220 T 420 200" stroke="#FBF8FF" strokeWidth="1.5" strokeDasharray="4 6" fill="none"/>
            <path d="M 80 -20 Q 90 120 210 240 T 240 600" stroke="#E4DAF5" strokeWidth="10" fill="none" strokeLinecap="round"/>
            <path d="M 80 -20 Q 90 120 210 240 T 240 600" stroke="#FBF8FF" strokeWidth="1.5" strokeDasharray="4 6" fill="none"/>
          </svg>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────
    // Stage rail + meta (outside the device)
    // ─────────────────────────────────────────────────────────────
    function StageMeta() {
      return (
        <>
          <div className="stage-rail">
            <div className="num">CARD SYSTEM / 2026</div>
            <div className="ar-label">وصلها · بطاقات</div>
            <div className="en-label">Diagonal Cards.</div>
            <div className="num" style={{ marginTop: 4 }}>SPLIT-GEOMETRY · MICRO-MOTION</div>
          </div>
          <div className="stage-meta">
            <div>© 2026 WASILHA INDUSTRIES · KRT</div>
            <div style={{ display: 'flex', gap: 14 }}>
              <span>SIX UNIQUE CUTS · ONE LANGUAGE</span>
              <span style={{ color: WASILHA.purple }}>● PROTOTYPE LIVE</span>
            </div>
          </div>
        </>
      );
    }

    // ─────────────────────────────────────────────────────────────
    // Bottom-sheet host w/ draggable handle
    // ─────────────────────────────────────────────────────────────
    function BottomSheet({ children, header, expanded, onToggleExpanded }) {
      // sheet starts at translateY = peekY (collapsed) or 0 (expanded)
      const SHEET_HEIGHT = 720;        // sheet content height area
      const PEEK = 280;                // px visible when collapsed
      const peekY = SHEET_HEIGHT - PEEK;

      const [drag, setDrag] = useState(null); // { startY, baseY }
      const [offset, setOffset] = useState(expanded ? 0 : peekY);
      const sheetRef = useRef(null);

      useEffect(() => {
        if (!drag) setOffset(expanded ? 0 : peekY);
      }, [expanded]);

      const onPointerDown = (e) => {
        const baseY = expanded ? 0 : peekY;
        setDrag({ startY: e.clientY, baseY });
        e.currentTarget.setPointerCapture?.(e.pointerId);
      };
      const onPointerMove = (e) => {
        if (!drag) return;
        const dy = e.clientY - drag.startY;
        let next = drag.baseY + dy;
        next = Math.max(0, Math.min(peekY, next));
        setOffset(next);
      };
      const onPointerUp = (e) => {
        if (!drag) return;
        // snap to nearest
        const snapExpanded = offset < peekY / 2;
        setDrag(null);
        setOffset(snapExpanded ? 0 : peekY);
        onToggleExpanded(snapExpanded);
      };

      return (
        <div
          ref={sheetRef}
          className={'ws-sheet' + (drag ? ' dragging' : '')}
          style={{
            position: 'absolute', left: 0, right: 0, bottom: 0,
            height: SHEET_HEIGHT,
            transform: `translateY(${offset}px)`,
            background: '#FFFFFF',
            borderTopLeftRadius: 32, borderTopRightRadius: 32,
            boxShadow: '0 -14px 38px rgba(20,15,30,0.12), 0 -1px 0 rgba(255,255,255,0.7) inset',
            display: 'flex', flexDirection: 'column',
            zIndex: 20,
          }}
        >
          {/* Drag handle */}
          <div
            onPointerDown={onPointerDown}
            onPointerMove={onPointerMove}
            onPointerUp={onPointerUp}
            onPointerCancel={onPointerUp}
            style={{
              padding: '14px 0 6px', display: 'flex', justifyContent: 'center',
              cursor: 'grab', touchAction: 'none',
            }}
          >
            <div style={{ width: 44, height: 5, borderRadius: 3, background: '#E2DDD0' }}/>
          </div>

          {/* Header */}
          <div style={{ padding: '4px 22px 12px' }}>
            {header}
          </div>

          {/* Content */}
          <div className="no-scroll" style={{
            flex: 1, overflowY: 'auto',
            padding: '14px 18px 40px',
          }}>
            {children}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────────────
    function App() {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [tweaksOpen, setTweaksOpen] = useState(false);
      const [expanded, setExpanded] = useState(tweaks.sheetExpanded);
      const [category, setCategory] = useState(tweaks.category || 'rides');

      useEffect(() => {
        const handler = (e) => {
          if (!e.data) return;
          if (e.data.type === '__activate_edit_mode') setTweaksOpen(true);
          if (e.data.type === '__deactivate_edit_mode') setTweaksOpen(false);
        };
        window.addEventListener('message', handler);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', handler);
      }, []);

      const closeTweaks = () => {
        setTweaksOpen(false);
        window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
      };

      const lang = tweaks.lang;
      const dir  = lang === 'ar' ? 'rtl' : 'ltr';
      const overlap = tweaks.stackOverlap;

      const RIDE_CARDS = [
        { id: 'raksha',   Comp: RakshaCard },
        { id: 'car',      Comp: CarCard },
        { id: 'moto',     Comp: MotoCard },
        { id: 'schedule', Comp: ScheduleCard },
      ];
      const SEND_CARDS = [
        { id: 'delivery', Comp: DeliveryCard },
        { id: 'food',     Comp: FoodCard },
      ];
      const cards = category === 'rides' ? RIDE_CARDS : SEND_CARDS;

      const header = (
        <div>
          {/* Tabs */}
          <div style={{ display: 'flex', gap: 4, marginBottom: 16, padding: 4, background: '#F4F0EA', borderRadius: 999, alignSelf: 'flex-start', width: 'fit-content' }}>
            <button className={'pill-tab' + (category === 'rides' ? ' active' : '')}
                    onClick={() => setCategory('rides')}>
              {lang === 'ar' ? 'مشاوير' : 'Rides'}
            </button>
            <button className={'pill-tab' + (category === 'send' ? ' active' : '')}
                    onClick={() => setCategory('send')}>
              {lang === 'ar' ? 'توصيل و طعام' : 'Send & Eat'}
            </button>
          </div>

          {/* Title */}
          <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 12 }}>
            <div>
              <div className="mono" style={{ fontSize: 9.5, color: '#A6A29A', letterSpacing: '0.32em' }}>
                {category === 'rides'
                  ? (lang === 'ar' ? '٤ خيارات للحركة' : '4 WAYS TO MOVE')
                  : (lang === 'ar' ? 'وصّل أي شيء' : 'SEND ANYTHING')}
              </div>
              <div className="serif" style={{ fontSize: 26, lineHeight: 1.0, letterSpacing: '-0.025em', marginTop: 4 }}>
                {category === 'rides'
                  ? <>Move your <span style={{ color: WASILHA.purple, fontStyle: 'italic' }}>way.</span></>
                  : <>Send <span style={{ color: WASILHA.purple, fontStyle: 'italic' }}>anything.</span></>
                }
              </div>
              {lang === 'ar' && (
                <div className="ar-serif" style={{ fontSize: 18, color: WASILHA.deepPurple, marginTop: 4 }}>
                  {category === 'rides' ? 'كيف تريد الحركة؟' : 'شنو الذي نوصّله؟'}
                </div>
              )}
            </div>
            <button style={{
              padding: '7px 12px', borderRadius: 999, border: '0.5px solid rgba(114,52,128,0.18)',
              background: 'rgba(157,0,255,0.06)', color: WASILHA.deepPurple,
              fontFamily: 'Geist Mono, monospace', fontSize: 9.5, letterSpacing: '0.22em',
              cursor: 'pointer',
            }}>
              {lang === 'ar' ? 'تخصيص' : 'CUSTOMIZE'}
            </button>
          </div>
        </div>
      );

      return (
        <div className="stage">
          <StageMeta/>

          <div className="device-stage">
            <div className="device-caption">
              <span className="dot"/>
              <span>CARD SYSTEM</span>
              <span style={{ opacity: 0.5 }}>·</span>
              <span style={{ color: '#0A0908' }}>Six unique cuts, one design language</span>
            </div>

            <IOSDevice width={402} height={874} dark={false}>
              <div dir={dir} style={{ position: 'absolute', inset: 0, overflow: 'hidden', background: '#FFFFFF' }}>
                <Backdrop lang={lang}/>

                <BottomSheet
                  expanded={expanded}
                  onToggleExpanded={(v) => { setExpanded(v); setTweak('sheetExpanded', v); }}
                  header={header}
                >
                  <div className="ws-stack" style={{ display: 'flex', flexDirection: 'column' }}>
                    {cards.map((c, i) => (
                      <div key={c.id} style={{
                        marginTop: i === 0 ? 0 : -overlap,
                        zIndex: 10 + i,
                        position: 'relative',
                      }}>
                        <c.Comp lang={lang}/>
                      </div>
                    ))}
                  </div>

                  {/* Filler at end of scroll */}
                  <div style={{
                    marginTop: 22, padding: 16, borderRadius: 18,
                    background: 'linear-gradient(135deg, #FFFFE3 0%, #DBD4FF 100%)',
                    border: '0.5px solid rgba(114,52,128,0.12)',
                    display: 'flex', alignItems: 'center', gap: 14,
                  }}>
                    <div style={{ width: 42, height: 42, borderRadius: 12, background: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 4px 10px rgba(114,52,128,0.10)' }}>
                      <MiniIcon name="pin" size={20} color={WASILHA.deepPurple} strokeWidth={1.6}/>
                    </div>
                    <div style={{ flex: 1 }}>
                      <div className="mono" style={{ fontSize: 9, letterSpacing: '0.28em', color: WASILHA.deepPurple, opacity: 0.7 }}>
                        {lang === 'ar' ? 'مفضلتك' : 'YOUR SHORTCUTS'}
                      </div>
                      <div style={{ fontSize: 13.5, fontWeight: 500, color: WASILHA.deepPurple, marginTop: 2 }}>
                        {lang === 'ar' ? 'البيت · العمل · مطار الخرطوم' : 'Home · Work · KRT Airport'}
                      </div>
                    </div>
                    <button style={{
                      all: 'unset', cursor: 'pointer',
                      width: 30, height: 30, borderRadius: '50%',
                      background: WASILHA.deepPurple, color: '#FFFFE3',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                    }}>
                      <MiniIcon name="arrow" size={14} color="#FFFFE3" strokeWidth={2}/>
                    </button>
                  </div>
                </BottomSheet>
              </div>
            </IOSDevice>
          </div>

          {/* Tweaks */}
          {tweaksOpen && (
            <TweaksPanel title="Tweaks" onClose={closeTweaks}>
              <TweakSection title="Sheet">
                <TweakRadio
                  label="State"
                  value={expanded ? 'open' : 'peek'}
                  onChange={(v) => { const open = v === 'open'; setExpanded(open); setTweak('sheetExpanded', open); }}
                  options={[
                    { label: 'Peek', value: 'peek' },
                    { label: 'Open', value: 'open' },
                  ]}
                />
                <TweakSlider
                  label="Stack overlap"
                  min={0} max={40} step={2}
                  value={tweaks.stackOverlap}
                  onChange={(v) => setTweak('stackOverlap', v)}
                />
              </TweakSection>

              <TweakSection title="Category">
                <TweakRadio
                  label="Set"
                  value={category}
                  onChange={(v) => { setCategory(v); setTweak('category', v); }}
                  options={[
                    { label: 'Rides', value: 'rides' },
                    { label: 'Send', value: 'send' },
                  ]}
                />
              </TweakSection>

              <TweakSection title="Language">
                <TweakRadio
                  label="Direction"
                  value={tweaks.lang}
                  onChange={(v) => setTweak('lang', v)}
                  options={[
                    { label: 'EN', value: 'en' },
                    { label: 'العربية', value: 'ar' },
                  ]}
                />
              </TweakSection>

              <TweakSection title="Hint">
                <div style={{ fontSize: 11.5, color: '#6B6862', lineHeight: 1.5 }}>
                  Drag the handle on the sheet to peek/open. Press any card to see the two halves slide apart.
                </div>
              </TweakSection>
            </TweaksPanel>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('app'));
    root.render(<App />);
  </script>
</body>
</html>
