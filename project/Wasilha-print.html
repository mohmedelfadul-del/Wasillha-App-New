<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Wasilha — Print</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    /* Print layout — one iPhone per page, portrait */
    @page { size: A4 portrait; margin: 12mm 10mm; }

    html, body {
      background: #FFFFFF !important;
      margin: 0; padding: 0;
    }
    body::before { display: none !important; } /* kill noise overlay */

    .print-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      padding: 24px 0 48px;
      background: #FFFFFF;
    }

    .print-page {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      break-inside: avoid;
      page-break-inside: avoid;
      break-after: page;
      page-break-after: always;
    }
    .print-page:last-child {
      break-after: auto;
      page-break-after: auto;
    }

    .print-caption {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: 'Geist Mono', monospace;
      font-size: 9.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #6B6862;
      padding: 0 8px;
      border-bottom: 0.5px solid #E8E6E1;
      padding-bottom: 8px;
    }
    .print-caption .label {
      color: #0A0908;
      letter-spacing: 0.18em;
    }
    .print-caption .num {
      color: #A6A29A;
    }

    .print-device-wrap {
      transform: scale(0.62);
      transform-origin: top center;
      width: 402px;
      height: 874px;
      margin: 0 auto;
    }

    .print-footer {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-family: 'Geist Mono', monospace;
      font-size: 8.5px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #A6A29A;
      padding: 0 8px;
      margin-top: -120px; /* pull up under scaled device */
    }

    /* Cover page */
    .print-cover {
      width: 100%;
      max-width: 540px;
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 24px 24px;
      break-after: page;
      page-break-after: always;
    }
    .print-cover .top {
      font-family: 'Geist Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #A6A29A;
      display: flex; justify-content: space-between;
    }
    .print-cover .title-block {
      margin-top: 80px;
    }
    .print-cover .ar {
      font-family: 'Amiri', serif;
      font-size: 72px;
      line-height: 1;
      color: #0A0908;
    }
    .print-cover .en {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 64px;
      line-height: 1;
      letter-spacing: -0.025em;
      color: #0A0908;
      margin-top: 10px;
    }
    .print-cover .sub {
      font-size: 14px;
      color: #6B6862;
      margin-top: 18px;
      max-width: 380px;
      line-height: 1.5;
    }
    .print-cover .accent-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #9D00FF;
      display: inline-block;
      margin-right: 8px;
      vertical-align: middle;
    }
    .print-cover .bot {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-family: 'Geist Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #6B6862;
    }
    .print-cover .index {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 24px;
      margin-top: 40px;
      max-width: 460px;
    }
    .print-cover .index .row {
      display: flex; gap: 8px;
      font-family: 'Geist', sans-serif;
      font-size: 11.5px;
      color: #0A0908;
      padding: 4px 0;
      border-bottom: 0.5px dashed #E8E6E1;
    }
    .print-cover .index .row .n {
      font-family: 'Geist Mono', monospace;
      font-size: 9.5px;
      color: #A6A29A;
      letter-spacing: 0.18em;
      width: 22px;
    }

    /* Print-only: disable animations */
    @media print {
      *, *::before, *::after {
        animation-duration: 0s !important;
        animation-delay: 0s !important;
        transition: none !important;
      }
      .print-stage { gap: 0; padding: 0; }
      .print-page { max-width: none; gap: 8px; }
      .print-device-wrap { transform: scale(0.58); }
      html, body { background: #FFFFFF !important; }
    }

    /* Hide loading state when JS isn't ready */
    .print-loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #FFFFFF;
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #A6A29A;
      z-index: 9999;
    }
    .print-loading.hidden { display: none; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div class="print-loading" id="print-loading">PREPARING PRINT · WASILHA</div>
  <div id="app"></div>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="screens-pre.jsx"></script>
  <script type="text/babel" src="screens-main.jsx"></script>
  <script type="text/babel" src="screens-aux.jsx"></script>
  <script type="text/babel" src="screens-extra.jsx"></script>

  <script type="text/babel">
    const SCREENS = [
      { id: 'splash',        label: '01 Splash',        cap: 'Identity beat' },
      { id: 'onboarding',    label: '02 Onboarding',    cap: 'Three promises' },
      { id: 'login',         label: '03 Login',         cap: 'Phone-first auth' },
      { id: 'otp',           label: '04 OTP',           cap: 'Verify · 6 digits' },
      { id: 'home',          label: '05 Home',          cap: 'Map + services' },
      { id: 'search',        label: '06 Search',        cap: 'Pick destination' },
      { id: 'booking',       label: '07 Booking',       cap: 'Choose your ride' },
      { id: 'tracking',      label: '08 Tracking',      cap: 'Live · driver inbound' },
      { id: 'complete',      label: '09 Trip done',     cap: 'Rate · pay · receipt' },
      { id: 'wallet',        label: '10 Wallet',        cap: 'Balance · activity' },
      { id: 'topup',         label: '11 Top-up',        cap: 'Add funds' },
      { id: 'history',       label: '12 History',       cap: 'Where you\'ve been' },
      { id: 'notifications', label: '13 Notifications', cap: "What's new" },
      { id: 'saved',         label: '14 Saved places',  cap: 'Your shortcuts' },
      { id: 'settings',      label: '15 Account',       cap: 'Profile · prefs' },
      { id: 'sos',           label: '16 Safety / SOS',  cap: 'Hold for safety team' },
    ];

    const TWEAKS = {
      accent: '#9D00FF',
      glass: 20,
      cardLayout: 'grid',
      mapStyle: 'illustrated',
      language: 'en',
    };

    function PrintApp() {
      const screenProps = {
        nav: () => {}, // disabled in print
        accent: TWEAKS.accent,
        lang: TWEAKS.language,
        glass: TWEAKS.glass,
        cardLayout: TWEAKS.cardLayout,
        mapStyle: TWEAKS.mapStyle,
      };

      const ScreenMap = {
        splash:        SplashScreen,
        onboarding:    OnboardingScreen,
        login:         LoginScreen,
        otp:           OTPScreen,
        home:          HomeScreen,
        search:        SearchScreen,
        booking:       BookingScreen,
        tracking:      TrackingScreen,
        complete:      CompleteScreen,
        wallet:        WalletScreen,
        topup:         TopupScreen,
        history:       HistoryScreen,
        notifications: NotificationsScreen,
        saved:         SavedScreen,
        settings:      SettingsScreen,
        sos:           SOSScreen,
      };

      return (
        <div className="print-stage">
          {/* Cover */}
          <div className="print-cover">
            <div className="top">
              <span>WASILHA · CASE FILE</span>
              <span>2026 · HI-FI PROTOTYPE</span>
            </div>
            <div className="title-block">
              <div className="ar" dir="rtl">وصلها</div>
              <div className="en">Wasilha.</div>
              <div className="sub">
                <span className="accent-dot"/>
                Premium mobility for Sudan — sixteen-screen iOS prototype. Splash to safety, all flows captured.
              </div>

              <div className="index">
                {SCREENS.map((s, i) => (
                  <div key={s.id} className="row">
                    <span className="n">{String(i + 1).padStart(2, '0')}</span>
                    <span style={{ flex: 1 }}>{s.label.replace(/^\d\d\s/, '')}</span>
                    <span style={{ color: '#A6A29A', fontFamily: 'Geist Mono', fontSize: 9.5, letterSpacing: '0.16em' }}>{s.cap.toUpperCase()}</span>
                  </div>
                ))}
              </div>
            </div>
            <div className="bot">
              <span>© 2026 WASILHA INDUSTRIES · KRT</span>
              <span style={{ color: '#9D00FF' }}>● PRINT EDITION</span>
            </div>
          </div>

          {/* One device per page */}
          {SCREENS.map((s, i) => {
            const Screen = ScreenMap[s.id];
            return (
              <div key={s.id} className="print-page">
                <div className="print-caption">
                  <span className="label">{s.label} · {s.cap}</span>
                  <span className="num">{String(i + 1).padStart(2, '0')} / {SCREENS.length}</span>
                </div>
                <div className="print-device-wrap">
                  <IOSDevice width={402} height={874} dark={false}>
                    <div dir="ltr" style={{ position: 'absolute', inset: 0, overflow: 'hidden', background: '#FBFAF6' }}>
                      <Screen {...screenProps} />
                    </div>
                  </IOSDevice>
                </div>
                <div className="print-footer">
                  <span>WASILHA · {s.label.toUpperCase()}</span>
                  <span>iOS · 402 × 874</span>
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('app'));
    root.render(<PrintApp />);

    // Hide the loading curtain once React + fonts settle, then auto-print
    (async () => {
      try { await document.fonts.ready; } catch (e) {}
      await new Promise(r => setTimeout(r, 800));
      const loader = document.getElementById('print-loading');
      if (loader) loader.classList.add('hidden');
      await new Promise(r => setTimeout(r, 500));
      window.print();
    })();
  </script>
</body>
</html>
