name: wasilha
description: "Wasilha — وصلها. Rides, raksha, delivery and food for Sudan."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  flutter_svg: ^2.0.17
  google_fonts: ^9.0.0
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  google_maps_flutter: ^2.12.1
  geolocator: ^14.0.0
  shared_preferences: ^2.5.3
  intl: any
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#FBFAF6"
  adaptive_icon_foreground: assets/icon/app_icon_fg.png
  remove_alpha_ios: true
