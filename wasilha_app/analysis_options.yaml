include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Flutter 3.47+ marks package:flutter/material.dart as moving to
    # package:material_ui; keep the stable import until that migration.
    deprecated_member_use: ignore
  exclude:
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    prefer_const_constructors: true
