            <div className="mono" style={{ fontSize: 9.5, letterSpacing: '0.22em', color: 'rgba(255,255,255,0.45)' }}>
              TRIPS
            </div>
            <div style={{ fontSize: 22, marginTop: 4, fontFamily: 'Instrument Serif, serif', letterSpacing: '-0.02em' }}>
              9 <span style={{ fontSize: 11, color: 'rgba(255,255,255,0.45)' }}>/ 12</span>
            </div>
          </div>
        </div>
      </div>

      {/* Feed header */}
      <div style={{ display: 'flex', alignItems: 'center', padding: '20px 18px 10px' }}>
        <div style={{
          width: 8, height: 8, borderRadius: '50%', background: accent,
          boxShadow: `0 0 10px ${accent}`,
          marginRight: 10,
        }} />
        <div className="mono" style={{ fontSize: 11, letterSpacing: '0.22em' }}>
          {t.feed}
        </div>
        <div style={{ flex: 1 }} />
        <span className="mono" style={{ fontSize: 9.5, letterSpacing: '0.18em', color: 'rgba(255,255,255,0.45)' }}>
          247 {t.nearby.toUpperCase()}
        </span>
      </div>

      {/* Requests */}
      <div style={{ padding: '0 18px 30px', display: 'flex', flexDirection: 'column', gap: 10 }}>
        {requests.filter((r) => !skipped[r.id]).map((r) => (
          <div key={r.id} style={{
            background: 'rgba(255,255,255,0.04)',
            border: '0.5px solid rgba(255,255,255,0.08)',
            borderRadius: 20, padding: '14px 14px 12px',
            animation: 'ws-bid-in 0.42s cubic-bezier(0.2,0.85,0.2,1) both',
            position: 'relative', overflow: 'hidden',
          }}>
            {/* glow accent */}
            {r.vibe === 'high' && (
              <div style={{
                position: 'absolute', right: -40, top: -40, width: 140, height: 140, borderRadius: '50%',
                background: `radial-gradient(circle, ${accent}40 0%, transparent 70%)`,
                pointerEvents: 'none',
              }} />
            )}

            {/* header */}
            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              <Avatar size={36} label={r.name.split(' ').map(p => p[0]).join('')} tone={r.tone} />
              <div style={{ flex: 1 }}>
                <div style={{ display: 'flex', alignItems: 'baseline', gap: 6 }}>
                  <span style={{ fontSize: 13.5, fontWeight: 500 }}>{r.name}</span>
                  <span className="mono" style={{ fontSize: 10, color: 'rgba(255,255,255,0.55)' }}>★ {r.rating.toFixed(1)}</span>
                </div>
                <div className="mono" style={{ fontSize: 9.5, color: 'rgba(255,255,255,0.45)', letterSpacing: '0.14em', marginTop: 2 }}>
                  {r.etaMin} {t.minAway.toUpperCase()} · {r.distance} KM · {r.pax} PAX
                </div>
              </div>
              <div style={{ textAlign: 'right' }}>
                <div className="serif" style={{ fontSize: 26, letterSpacing: '-0.02em', lineHeight: 1 }}>
                  {r.offer.toLocaleString()}
                </div>
                <div className="mono" style={{ fontSize: 9, color: 'rgba(255,255,255,0.45)', letterSpacing: '0.22em', marginTop: 3 }}>
                  {t.sdg}
                </div>
              </div>
            </div>

            {/* route */}
            <div style={{
              marginTop: 12, display: 'flex', alignItems: 'center', gap: 12,
              padding: '10px 12px', borderRadius: 12,
              background: 'rgba(255,255,255,0.04)',
            }}>
              <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2 }}>
                <div style={{ width: 6, height: 6, borderRadius: '50%', background: '#9DEACB' }} />
                <div style={{ width: 1, height: 14, background: 'rgba(255,255,255,0.2)' }} />
                <div style={{ width: 6, height: 6, borderRadius: 1, background: accent }} />
              </div>
              <div style={{ flex: 1, minWidth: 0, fontSize: 11.5, lineHeight: 1.5 }}>
                <div style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{r.from}</div>
                <div style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', opacity: 0.7 }}>{r.to}</div>
              </div>
            </div>

            {/* actions */}
            <div style={{ display: 'flex', gap: 6, marginTop: 10 }}>
              <button onClick={() => setSkipped((s) => ({ ...s, [r.id]: true }))} style={{
                width: 44, height: 42, borderRadius: 12, border: '0.5px solid rgba(255,255,255,0.1)',
                background: 'rgba(255,255,255,0.04)', color: '#FBFAF6', cursor: 'pointer',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
              }} aria-label={t.decline}>
                <Icon name="close" size={15} strokeWidth={1.8} />
              </button>
              <button style={{
                flex: 1, height: 42, borderRadius: 12,
                background: 'rgba(255,255,255,0.06)', color: '#FBFAF6',
                border: '0.5px solid rgba(255,255,255,0.1)', cursor: 'pointer',
                fontFamily: 'inherit', fontSize: 12.5, letterSpacing: '-0.005em',
              }}>{t.counter}</button>
              <button onClick={() => nav('driverDelivery')} style={{
                flex: 1.4, height: 42, borderRadius: 12, border: 0, cursor: 'pointer',
                background: accent, color: '#FBFAF6',
                fontFamily: 'inherit', fontSize: 13, letterSpacing: '-0.005em',
                display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
                boxShadow: `0 6px 18px ${accent}55`,
              }}>
                {t.accept}
                <Icon name="arrow" size={14} strokeWidth={2} />
              </button>
            </div>
          </div>
        ))}

        {requests.length === 0 && (
          <div style={{
            padding: '24px', borderRadius: 18,
            border: '0.5px dashed rgba(255,255,255,0.1)',
            color: 'rgba(255,255,255,0.55)',
            textAlign: 'center', fontSize: 12,
          }}>
            <div className="mono" style={{
              fontSize: 10.5, letterSpacing: '0.22em', color: 'rgba(255,255,255,0.4)',
            }}>
              · LISTENING ·
            </div>
            <div style={{ marginTop: 8 }}>Waiting for nearby riders to send offers.</div>
          </div>
        )}
      </div>
    </div>
  );
}

Object.assign(window, { FoodScreen, ParcelScreen, DriverRequestsScreen });

</script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "#9D00FF",
      "glass": 15,
      "cardLayout": "pairs",
      "mapStyle": "illustrated",
      "language": "en"
    }/*EDITMODE-END*/;

    // Screen catalog (label · short caption · order)
    const SCREENS = [
      { id: 'splash',        label: '01 Splash',        cap: 'Identity beat' },
      { id: 'onboarding',    label: '02 Onboarding',    cap: 'Three promises' },
      { id: 'login',         label: '03 Login',         cap: 'Phone-first auth' },
      { id: 'otp',           label: '04 OTP',           cap: 'Verify · 6 digits' },
      { id: 'role',          label: '05 Role',          cap: 'Passenger · Driver · Store' },
      { id: 'home',          label: '06 Home',          cap: 'Map + services' },
      { id: 'search',        label: '07 Search',        cap: 'Pick destination' },
      { id: 'booking',       label: '08 Booking',       cap: 'Choose your ride' },
      { id: 'offer',         label: '09 Offer',         cap: 'Set fare · driver bids' },
      { id: 'food',          label: '09b Food',         cap: 'Restaurant · menu' },
      { id: 'parcel',        label: '09c Parcel',       cap: 'Send a package' },
      { id: 'tracking',      label: '10 Tracking',      cap: 'Live · driver inbound' },
      { id: 'complete',      label: '11 Trip done',     cap: 'Rate · pay · receipt' },
      { id: 'wallet',        label: '12 Wallet',        cap: 'Balance · activity' },
      { id: 'topup',         label: '13 Top-up',        cap: 'Add funds' },
      { id: 'history',       label: '14 History',       cap: 'Where you\'ve been' },
      { id: 'notifications', label: '15 Notifications', cap: 'What\'s new' },
      { id: 'saved',         label: '16 Saved places',  cap: 'Your shortcuts' },
      { id: 'settings',      label: '17 Account',       cap: 'Profile · prefs' },
      { id: 'sos',           label: '18 Safety / SOS',  cap: 'Hold for safety team' },
      { id: 'driverHome',     label: '19 Driver',        cap: 'Online · accept rides' },
      { id: 'driverRequests', label: '19b Requests',     cap: 'Incoming offers · bids' },
      { id: 'driverEarnings', label: '20 Earnings',      cap: 'Weekly · breakdown' },
      { id: 'driverDelivery', label: '21 Driver trip',   cap: 'Pickup → drop-off' },
      { id: 'store',          label: '22 Store',         cap: 'Orders · menu · branches' },
    ];

    function App() {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [screen, setScreen] = useState('splash');
      const [tweaksOpen, setTweaksOpen] = useState(false);

      // Listen for host edit-mode messages (registered BEFORE announcing available)
      useEffect(() => {
        const handler = (e) => {
          if (!e.data) return;
          if (e.data.type === '__activate_edit_mode') setTweaksOpen(true);
          if (e.data.type === '__deactivate_edit_mode') setTweaksOpen(false);
        };
        window.addEventListener('message', handler);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', handler);
      }, []);

      const nav = (id) => {
        setScreen(id);
        // scroll the inner device viewport to top whenever screen changes
        requestAnimationFrame(() => {
          document.querySelectorAll('.no-scroll').forEach(el => { el.scrollTop = 0; });
        });
      };

      const screenProps = {
        nav,
        accent: tweaks.accent,
        lang: tweaks.language,
        glass: tweaks.glass,
        cardLayout: tweaks.cardLayout,
        mapStyle: tweaks.mapStyle,
      };

      const current = SCREENS.find(s => s.id === screen);

      const ScreenEl = {
        splash:        SplashScreen,
        onboarding:    OnboardingScreen,
        login:         LoginScreen,
        otp:           OTPScreen,
        role:          RoleScreen,
        home:          HomeScreen,
        search:        SearchScreen,
        booking:       BookingScreen,
        offer:         OfferScreen,
        food:          FoodScreen,
        parcel:        ParcelScreen,
        tracking:      TrackingScreen,
        complete:      CompleteScreen,
        wallet:        WalletScreen,
        topup:         TopupScreen,
        history:       HistoryScreen,
        notifications: NotificationsScreen,
        saved:         SavedScreen,
        settings:      SettingsScreen,
        sos:           SOSScreen,
        driverHome:     DriverHomeScreen,
        driverRequests: DriverRequestsScreen,
        driverEarnings: DriverEarningsScreen,
        driverDelivery: DriverDeliveryScreen,
        store:          StoreScreen,
      }[screen];

      // hide tweaks panel close also flips host toggle
      const closeTweaks = () => {
        setTweaksOpen(false);
        window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
      };

      const dir = tweaks.language === 'ar' ? 'rtl' : 'ltr';

      return (
        <div className="stage">
          {/* Stage rail (decorative) */}
          <div className="stage-rail">
            <div className="num">CASE FILE / 2026</div>
            <div className="ar-label">وصلها</div>
            <div className="en-label">Wasilha.</div>
            <div className="num" style={{ marginTop: 4 }}>HI-FI PROTOTYPE · iOS</div>
          </div>

          <div className="device-stage">
            <div className="device-caption">
              <span className="dot" />
              <span>{current.label}</span>
              <span style={{ opacity: 0.5 }}>·</span>
              <span style={{ color: '#0A0908' }}>{current.cap}</span>
            </div>

            <IOSDevice width={402} height={874} dark={false}>
              <div dir={dir} style={{ position: 'absolute', inset: 0, overflow: 'hidden', background: '#FBFAF6' }}>
                <ScreenEl key={screen} {...screenProps} />
              </div>
            </IOSDevice>

            {/* Screen picker rail (right side) */}
            <ScreenPicker screens={SCREENS} current={screen} onPick={nav} accent={tweaks.accent} />
          </div>

          <div className="stage-meta">
            <div>© 2026 WASILHA INDUSTRIES · KRT</div>
            <div style={{ display: 'flex', gap: 14 }}>
              <span>SAFE-AREA · NOTCH · DYNAMIC ISLAND</span>
              <span style={{ color: tweaks.accent }}>● PROTOTYPE LIVE</span>
            </div>
          </div>

          {/* Tweaks panel */}
          {(
            <TweaksPanel title="Tweaks">
              <TweakSection label="Screen">
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6 }}>
                  {SCREENS.map(s => (
                    <button key={s.id} onClick={() => nav(s.id)} style={{
                      appearance: 'none', border: 0, cursor: 'pointer',
                      background: screen === s.id ? '#0A0908' : '#fff',
                      color: screen === s.id ? '#fff' : '#0A0908',
                      borderRadius: 8, padding: '8px 10px',
                      fontFamily: 'inherit', fontSize: 11, textAlign: 'left',
                      border: '0.5px solid rgba(0,0,0,0.08)',
                    }}>{s.label}</button>
                  ))}
                </div>
              </TweakSection>

              <TweakSection label="Brand">
                <TweakColor
                  label="Accent"
                  value={tweaks.accent}
                  onChange={(v) => setTweak('accent', v)}
                  options={['#9D00FF','#E4572E','#1F8A5B','#2A6FDB','#E4B73B']}
                />
              </TweakSection>

              <TweakSection label="Surface">
                <TweakSlider label="Glass intensity" min={0} max={100} step={5} value={tweaks.glass} onChange={(v) => setTweak('glass', v)} />
              </TweakSection>

              <TweakSection label="Home layout">
                <TweakRadio
                  label="Service cards"
                  value={tweaks.cardLayout}
                  onChange={(v) => setTweak('cardLayout', v)}
                  options={[
                    { label: 'Pairs', value: 'pairs' },
                    { label: 'Grid', value: 'grid' },
                    { label: 'Row', value: 'row' },
                  ]}
                />
              </TweakSection>

              <TweakSection label="Map">
                <TweakRadio
                  label="Style"
                  value={tweaks.mapStyle}
                  onChange={(v) => setTweak('mapStyle', v)}
                  options={[
                    { label: 'White', value: 'white' },
                    { label: 'Dark', value: 'dark' },
                    { label: 'Illus.', value: 'illustrated' },
                  ]}
                />
              </TweakSection>

              <TweakSection label="Language">
                <TweakRadio
                  label="Direction"
                  value={tweaks.language}
                  onChange={(v) => setTweak('language', v)}
                  options={[
                    { label: 'EN', value: 'en' },
                    { label: 'العربية', value: 'ar' },
                  ]}
                />
              </TweakSection>
            </TweaksPanel>
          )}
        </div>
      );
    }

    function ScreenPicker({ screens, current, onPick, accent }) {
      return (
        <div style={{
          display: 'flex', flexDirection: 'column', gap: 2,
          padding: '12px 10px',
          background: '#fff',
          border: '0.5px solid rgba(0,0,0,0.06)',
          borderRadius: 18,
          boxShadow: '0 10px 30px rgba(20,15,30,0.08)',
          minWidth: 200,
          alignSelf: 'stretch',
          height: 874,
          overflowY: 'auto',
        }}>
          <div className="mono" style={{ fontSize: 9, color: 'var(--text-3)', letterSpacing: '0.3em', padding: '6px 8px 10px' }}>
            FLOW · 25 SCREENS
          </div>
          {screens.map((s, i) => {
            const active = s.id === current;
            return (
              <button key={s.id} onClick={() => onPick(s.id)} style={{
                appearance: 'none', border: 0, cursor: 'pointer',
                background: active ? '#0A0908' : 'transparent',
                color: active ? '#fff' : '#0A0908',
                padding: '9px 10px', borderRadius: 10,
                fontFamily: 'inherit', fontSize: 12.5, textAlign: 'left',
                display: 'flex', alignItems: 'center', gap: 10,
              }}>
                <span className="mono" style={{
                  fontSize: 9, letterSpacing: '0.15em',
                  color: active ? 'rgba(255,255,255,0.5)' : 'var(--text-3)',
                  width: 18,
                }}>{String(i + 1).padStart(2, '0')}</span>
                <span style={{ flex: 1, letterSpacing: '-0.005em' }}>{s.label.replace(/^\d\d\s/, '')}</span>
                {active && <span style={{ width: 5, height: 5, borderRadius: '50%', background: accent }} />}
              </button>
            );
          })}
          <div style={{ flex: 1 }} />
          <div style={{
            margin: '10px 8px 6px', padding: '10px 0', borderTop: '0.5px solid var(--border)',
            fontSize: 10.5, color: 'var(--text-2)', lineHeight: 1.5,
          }}>
            <div className="mono" style={{ fontSize: 9, letterSpacing: '0.22em', color: 'var(--text-3)', marginBottom: 4 }}>HINTS</div>
            Use the Tweaks button (bottom-right) to flip language, swap the accent, or change map style.
          </div>
        </div>
      );
    }

    // Standalone toggle: outside the design host there is no toolbar, so this
    // posts the same activation message the host would send.
    function TweaksFAB() {
      return (
        <button className="tweaks-fab" onClick={() => window.postMessage({ type: '__activate_edit_mode' }, '*')}>
          <span className="dot" /> Tweaks
        </button>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('app'));
    root.render(<><App /><TweaksFAB /></>);
  </script>
</body>
</html>
